<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pro - Offline Mode</title>
    <!-- Cargamos la librería directamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0b0f1a; color: #ffffff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161e2e; padding: 30px; border-radius: 20px; border: 1px solid #38bdf8; text-align: center; width: 85%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-top: 0; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #1f2937; background: #0b0f1a; color: white; margin: 20px 0; box-sizing: border-box; font-size: 16px; }
        #qrcode { background: white; padding: 15px; border-radius: 10px; display: flex; justify-content: center; margin: 0 auto; }
        #qrcode img { width: 160px; height: 160px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Generador QR</h2>
    <input type="text" id="text" placeholder="Escribe algo..." oninput="generate()">
    <div id="qrcode"></div>
</div>

<script>
    // Inicializamos el QR con la palabra "Hola"
    var qrcode = new QRCode(document.getElementById("qrcode"), {
        text: "Hola",
        width: 160,
        height: 160,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    function generate() {
        var data = document.getElementById("text").value;
        if (data.trim() === "") {
            qrcode.clear(); // Limpia si no hay texto
        } else {
            qrcode.makeCode(data); // Genera el nuevo código
        }
    }
</script>

</body>
</html>
